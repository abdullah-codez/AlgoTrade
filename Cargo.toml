[package]
name = "algo_trade"
version = "0.1.0"
edition = "2021"
authors = ["AlgoTrade Architect"]
description = "Deterministic BTC Perpetual Trading Bot for Hyperliquid Testnet"

[lib]
name = "algo_trade"
path = "src/lib.rs"

[[bin]]
name = "algo_trade"
path = "src/main.rs"

[dependencies]
rust_decimal = { version = "1.36", features = ["serde", "maths"] }
rust_decimal_macros = "1.36"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
rand_chacha = "0.3"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.13.5", features = ["json"] }
tokio = { version = "1.54.1", features = ["full"] }
dotenvy = "0.15.7"
url = "2.5.8"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
futures-util = "0.3.34"
ethers = { version = "2.0.14", default-features = false, features = ["rustls"] }
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs"] }

[dev-dependencies]
# Additional dev dependencies if needed for tests
